spring.application.name=Nhom16-QuanLyCuaHangDienThoai
server.port=${PORT:8080}

# ===== Database (MySQL) =====
# Ghi đè bằng biến môi trường khi deploy: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/phone_shop?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# update: tiện cho đồ án. Production nên đổi sang "validate" + công cụ migration (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ===== JWT =====
# BẮT BUỘC đổi JWT_SECRET khi deploy (>= 32 ký tự ngẫu nhiên)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars-min!!}
app.jwt.expiration=${JWT_EXPIRATION:86400}

# ===== Dữ liệu mẫu =====
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-email=${ADMIN_EMAIL:admin@phoneshop.vn}
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}

# Không trả stacktrace ra client
server.error.include-stacktrace=never

# ===== Cấu hình Gửi Email (SMTP) =====
# Thiết lập tài khoản gửi mail (hoặc biến môi trường: MAIL_USERNAME, MAIL_PASSWORD)
# Với Gmail: Dùng Mật khẩu ứng dụng (App Password 16 ký tự)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:nguyentuananhnpc@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ifmwfsndyvellamd}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Địa chỉ người gửi hiển thị
app.mail.from=${MAIL_FROM:nguyentuananhnpc@gmail.com}
app.mail.sender-name=AURA PHONESTORE
